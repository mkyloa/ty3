# Налаштування ty3. Перевизначається прапорцями CLI.

[model]
# Провайдер: claude-cli (без ключа, на підписці) | gemini | anthropic
backend = "claude-cli"
# Завжди opus-5 за замовчуванням — переклад чутливий до якості.
name = "claude-opus-5"
# Запобіжник для проходу research: для маловідомого чи вигаданого фільму модель
# шукає раз за разом і без ліміту впирається в таймаут. Лише claude-cli.
search_budget_usd = 1.5
# effort для якість-чутливих проходів (translate, edit, bible, speakers)
effort = "high"
# effort для механічних проходів (fit, точкові виправлення)
effort_light = "medium"
max_tokens = 32000

[subtitle]
# Норми українського субтитрування (стиль Netflix UK-ua). Змінюй під замовника.
max_chars_per_line = 42
max_lines = 2
max_cps = 17.0          # символів на секунду для дорослої аудиторії
min_duration_ms = 833   # 5/6 секунди
max_duration_ms = 7000
# Тире діалогу: "—" (em dash) за українською нормою
dialogue_dash = "—"
quote_open = "«"
quote_close = "»"

[segment]
# Розрив між репліками, що вважається межею сцени
scene_gap_ms = 2500
max_cues_per_chunk = 50
max_chars_per_chunk = 6000
# Скільки реплик контексту подавати ліворуч/праворуч від чанка
context_before = 5
context_after = 5

[media]
# Ліміт на витягання субтитрів із контейнера, секунди. 0 = обчислити з розміру
# файлу: ffmpeg читає контейнер ЦІЛКОМ, тому 7.6 ГБ на диску 16 МБ/с — це ~8 хв.
extract_timeout_s = 0
# Консервативна нижня оцінка швидкості носія (МБ/с). USB 2.0 і HDD — близько 6.
slow_media_mb_s = 6.0

[run]
# Паралельність перекладу по сценах. 1 = послідовно (найкраща зв'язність).
jobs = 1
# Використовувати Batch API для нечутливих до латентності проходів (-50%)
batch = false
