[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ty3"
version = "0.1.0"
description = "EN→UK subtitle translation pipeline with character context, ти/Ви matrix and subtitle-norm fitting"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ty3 = "ty3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ty3 = ["prompts/*.md", "prompts/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
